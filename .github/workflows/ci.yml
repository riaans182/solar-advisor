name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Same as `make install`: bootstrap the project venv and install with dev extras.
      - name: Install
        run: make install
      # ruff (lint + format check), mypy --strict, import-linter contract, pytest.
      - name: Check (lint, typecheck, import contract, tests)
        run: make check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # eslint, vue-tsc --noEmit, vitest, vite build (the `check` script).
      - name: Check (lint, typecheck, tests, build)
        run: npm run check
